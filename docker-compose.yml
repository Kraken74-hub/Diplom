version: '3.8'

services:
  # Сервис базы данных PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: dima
      POSTGRES_PASSWORD: kraken
      POSTGRES_DB: wb_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data #чтобы база не удалялась после рестарта
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dima -d wb_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Сервис Redis для брокера задач Celery
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # Сервис Telegram-бота
  bot:
    build: .
    env_file: .env
    depends_on:
      - db
      - redis

  # Воркер Celery: выполняет трудоемкие задачи (проверка цен на WB)
  celery_worker:
    build: .
    command: celery -A src.tasks.celery_app worker --loglevel=info
    env_file: .env
    depends_on:
      - db
      - redis

  # Планировщик Celery Beat: каждые N минут/часов генерирует задачи для воркера
  celery_beat:
    build: .
    command: celery -A src.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      - redis

volumes:
    postgres_data: